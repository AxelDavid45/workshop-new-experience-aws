# Le dice a Amplify Hosting qué publicar. La página ya viene lista en web/,
# así que no hay nada que instalar ni compilar.
#
# No agregues comandos de npm aquí. El npm de Amplify es más viejo que el que
# pide package.json y engine-strict=true (en .npmrc) haría fallar el build.
version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Sitio estático en web/. No hay nada que instalar ni compilar."
  artifacts:
    baseDirectory: web
    files:
      - '**/*'
